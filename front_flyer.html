<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Frente do Folheto Polar Beats</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070c14;
      --accent-cyan: #5dd1ff;
      --accent-cyan-glow: rgba(93, 209, 255, 0.35);
      --text-primary: #ffffff;
      --text-muted: #94a3b8;
      --border-light: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 874px;
      height: 1240px;
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 60px;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      text-align: center;
      z-index: 10;
    }

    .brand-logo {
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(93, 209, 255, 0.45));
    }

    /* Product Section */
    .product-section {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px 0;
      z-index: 10;
    }

    .product-image {
      width: 90%;
      max-height: 400px;
      object-fit: contain;
      filter: 
        drop-shadow(0 0 30px rgba(93, 209, 255, 0.35))
        drop-shadow(0 20px 45px rgba(0, 0, 0, 0.95));
    }

    .air-flow {
      position: absolute;
      bottom: -30px;
      width: 80%;
      height: 60px;
      background: linear-gradient(to bottom, rgba(93, 209, 255, 0.25), transparent);
      filter: blur(15px);
      border-radius: 50%;
      z-index: -1;
      opacity: 0.7;
    }

    /* Content Area */
    .content-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      z-index: 10;
      margin: 10px 0 30px 0;
    }

    .headline {
      font-size: 21px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.4;
      max-width: 650px;
    }

    .slogan {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      line-height: 1.3;
    }

    /* Footer */
    .footer-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1.5px solid rgba(255, 255, 255, 0.08);
      padding-top: 25px;
      z-index: 10;
    }

    .contact-info {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .contact-info strong {
      color: #fff;
    }

    /* QR Code */
    .qr-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border-light);
      padding: 10px 15px;
      border-radius: 12px;
    }

    .qr-code {
      width: 70px;
      height: 70px;
      background-color: #ffffff;
      padding: 4px;
      border-radius: 6px;
    }

    .qr-text-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .qr-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      color: #ffffff;
      letter-spacing: 0.04em;
      font-family: 'Syne', sans-serif;
    }

    .qr-subtitle {
      font-size: 11px;
      color: var(--accent-cyan);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Premium Low-Poly Background -->
  <svg class="poly-bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 1240" preserveAspectRatio="none" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;">
    <!-- Base dark background -->
    <rect width="874" height="1240" fill="#040811"/>
    
    <!-- Top center radial glow -->
    <radialGradient id="topGlow" cx="50%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#5dd1ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#040811" stop-opacity="0"/>
    </radialGradient>
    <rect width="874" height="1240" fill="url(#topGlow)"/>

    <!-- Center product radial glow -->
    <radialGradient id="midGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5dd1ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#040811" stop-opacity="0"/>
    </radialGradient>
    <rect width="874" height="1240" fill="url(#midGlow)"/>

    <!-- Geometric triangles in bottom-left corner -->
    <g fill="#0c1220" stroke="#1e293b" stroke-width="0.7" opacity="0.45">
      <polygon points="0,1000 120,950 180,1050 0,1120"/>
      <polygon points="0,1120 180,1050 280,1180 0,1240"/>
      <polygon points="0,900 80,920 120,950 0,1000"/>
      <polygon points="120,950 180,1050 320,1000 220,920"/>
      <polygon points="180,1050 280,1180 400,1080 320,1000"/>
    </g>

    <!-- Geometric triangles in bottom-right corner -->
    <g fill="#0c1220" stroke="#1e293b" stroke-width="0.7" opacity="0.45">
      <polygon points="874,1000 754,950 694,1050 874,1120"/>
      <polygon points="874,1120 694,1050 594,1180 874,1240"/>
      <polygon points="874,900 794,920 754,950 874,1000"/>
      <polygon points="754,950 694,1050 554,1000 654,920"/>
      <polygon points="694,1050 594,1180 474,1080 554,1000"/>
    </g>

    <!-- Geometric triangles in top-right corner -->
    <g fill="#0c1220" stroke="#1e293b" stroke-width="0.7" opacity="0.3">
      <polygon points="874,150 780,120 810,240 874,280"/>
      <polygon points="874,0 720,50 780,120 874,150"/>
      <polygon points="780,120 810,240 700,200 680,100"/>
    </g>
  </svg>

  <!-- Header -->
  <div class="header-section">
    <img src="logo.png" alt="Polar Beats Logo" class="brand-logo">
  </div>

  <!-- Product Showcase -->
  <div class="product-section">
    <img src="produto-black-transparent.png" alt="Polar Beats Duo Black" class="product-image">
    <div class="air-flow"></div>
  </div>

  <!-- Headline & Slogan -->
  <div class="content-section">
    <p class="headline">O primeiro ar-condicionado com áudio premium integrado do mundo.</p>
    <h2 class="slogan">CLIMA QUE VOCÊ OUVE.<br>SOM QUE VOCÊ SENTE.</h2>
  </div>

  <!-- Footer -->
  <div class="footer-section">
    <div class="contact-info">
      <p><strong>www.polarbeats.com.br</strong></p>
      <p>contato@polarbeats.com.br</p>
    </div>

    <div class="qr-container">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.polarbeats.com.br" alt="QR Code" class="qr-code">
      <div class="qr-text-box">
        <span class="qr-title">Calcule Sua</span>
        <span class="qr-subtitle">Economia</span>
      </div>
    </div>
  </div>

</body>
</html>
