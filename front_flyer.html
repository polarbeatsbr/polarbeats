<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Frente do Folheto Polar Beats</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070c14;
      --accent-cyan: #5dd1ff;
      --accent-cyan-glow: rgba(93, 209, 255, 0.35);
      --text-primary: #ffffff;
      --text-muted: #94a3b8;
      --border-light: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 874px;
      height: 1240px;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(93, 209, 255, 0.12), transparent 55%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.01) 0%, transparent 40%),
        linear-gradient(225deg, rgba(93, 209, 255, 0.02) 0%, transparent 50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 60px;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .wave-glow {
      position: absolute;
      width: 140%;
      height: 300px;
      top: 35%;
      left: -20%;
      background: radial-gradient(ellipse at center, rgba(93, 209, 255, 0.1), transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
    }

    /* Header */
    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      text-align: center;
      z-index: 10;
    }

    .brand-logo {
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(93, 209, 255, 0.45));
    }

    /* Product Section */
    .product-section {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px 0;
      z-index: 10;
    }

    .product-image {
      width: 90%;
      max-height: 400px;
      object-fit: contain;
      filter: 
        drop-shadow(0 0 30px rgba(93, 209, 255, 0.35))
        drop-shadow(0 20px 45px rgba(0, 0, 0, 0.95));
    }

    .air-flow {
      position: absolute;
      bottom: -30px;
      width: 80%;
      height: 60px;
      background: linear-gradient(to bottom, rgba(93, 209, 255, 0.25), transparent);
      filter: blur(15px);
      border-radius: 50%;
      z-index: -1;
      opacity: 0.7;
    }

    /* Content Area */
    .content-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      z-index: 10;
      margin: 10px 0 30px 0;
    }

    .headline {
      font-size: 21px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.4;
      max-width: 650px;
    }

    .slogan {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      line-height: 1.3;
    }

    /* Footer */
    .footer-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1.5px solid rgba(255, 255, 255, 0.08);
      padding-top: 25px;
      z-index: 10;
    }

    .contact-info {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .contact-info strong {
      color: #fff;
    }

    /* QR Code */
    .qr-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border-light);
      padding: 10px 15px;
      border-radius: 12px;
    }

    .qr-code {
      width: 70px;
      height: 70px;
      background-color: #ffffff;
      padding: 4px;
      border-radius: 6px;
    }

    .qr-text-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .qr-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      color: #ffffff;
      letter-spacing: 0.04em;
      font-family: 'Syne', sans-serif;
    }

    .qr-subtitle {
      font-size: 11px;
      color: var(--accent-cyan);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="wave-glow"></div>

  <!-- Header -->
  <div class="header-section">
    <img src="logo.png" alt="Polar Beats Logo" class="brand-logo">
  </div>

  <!-- Product Showcase -->
  <div class="product-section">
    <img src="produto-black.png" alt="Polar Beats Duo Black" class="product-image">
    <div class="air-flow"></div>
  </div>

  <!-- Headline & Slogan -->
  <div class="content-section">
    <p class="headline">O primeiro ar-condicionado com áudio premium integrado do mundo.</p>
    <h2 class="slogan">CLIMA QUE VOCÊ OUVE.<br>SOM QUE VOCÊ SENTE.</h2>
  </div>

  <!-- Footer -->
  <div class="footer-section">
    <div class="contact-info">
      <p><strong>www.polarbeats.com.br</strong></p>
      <p>contato@polarbeats.com.br</p>
    </div>

    <div class="qr-container">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.polarbeats.com.br" alt="QR Code" class="qr-code">
      <div class="qr-text-box">
        <span class="qr-title">Calcule Sua</span>
        <span class="qr-subtitle">Economia</span>
      </div>
    </div>
  </div>

</body>
</html>
